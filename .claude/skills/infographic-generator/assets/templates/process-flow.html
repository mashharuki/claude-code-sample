<!DOCTYPE html>
<!--
  PROCESS / FLOW infographic — 16:9 (1600x900)
  Structure: header -> numbered step cards left->right with connectors -> outcome box -> source footer
  Use 3-6 steps. One sentence per step. One icon-dot per step, same style throughout.
  Palette = set #2 (tech). Swap vars from references/color-palettes.md.
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>インフォグラフィック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=M+PLUS+1p:wght@800&family=Inter:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#2A2D7C;--accent:#12B8A6;--neutral:#9AA0B4;
    --page:#FBFBFD;--ink:#1A1B2E;--card:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1600px;height:900px}
  body{background:var(--page);color:var(--ink);
    font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
    line-height:1.8;letter-spacing:.02em;padding:64px 72px 0;display:flex;flex-direction:column}
  .num{font-family:"Inter","Noto Sans JP",sans-serif;font-feature-settings:"tnum";font-weight:700}
  h1{font-family:"M PLUS 1p",sans-serif;font-weight:800;font-size:52px;line-height:1.3;color:var(--primary)}
  .dek{font-size:21px;color:var(--neutral);margin-top:10px}

  .steps{display:flex;align-items:stretch;gap:0;margin:56px 0 44px;flex:1}
  .step{flex:1;background:var(--card);border-radius:12px;padding:30px 26px;position:relative;display:flex;flex-direction:column}
  .step + .step{margin-left:44px}
  .step + .step::before{content:"";position:absolute;left:-38px;top:56px;width:32px;height:2px;background:var(--neutral)}
  .step + .step::after{content:"";position:absolute;left:-14px;top:50px;border:6px solid transparent;border-left-color:var(--neutral)}
  .badge{width:46px;height:46px;border-radius:50%;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:16px}
  .step.key .badge{background:var(--accent)}
  .step h2{font-size:20px;font-weight:700;color:var(--primary);margin-bottom:10px}
  .step p{font-size:15px;color:var(--ink)}

  .outcome{background:var(--primary);color:#fff;border-radius:12px;padding:22px 30px;margin-bottom:34px;
    display:flex;align-items:center;gap:20px}
  .outcome .num{font-size:40px;color:var(--accent)}
  .outcome span{font-size:17px}

  footer{padding:20px 0;font-size:12px;color:var(--neutral)}
</style>
</head>
<body>

  <header>
    <h1>プロセスの見出し：何を達成する手順か</h1>
    <p class="dek">補足の一文</p>
  </header>

  <div class="steps">
    <div class="step">
      <div class="badge num">1</div>
      <h2>ステップ名</h2>
      <p>このステップで起きることを一文で。</p>
    </div>
    <div class="step">
      <div class="badge num">2</div>
      <h2>ステップ名</h2>
      <p>このステップで起きることを一文で。</p>
    </div>
    <div class="step key">
      <div class="badge num">3</div>
      <h2>ステップ名（要所）</h2>
      <p>ここが肝、という一文。アクセント色で強調。</p>
    </div>
    <div class="step">
      <div class="badge num">4</div>
      <h2>ステップ名</h2>
      <p>このステップで起きることを一文で。</p>
    </div>
  </div>

  <div class="outcome">
    <span class="num">-40%</span>
    <span>最終的な成果・アウトプットを一言で（数値があれば verbatim で）</span>
  </div>

  <footer>出典：〇〇 / 作成：2026-09-01</footer>

</body>
</html>
